name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  VPS_HOST: 82.25.93.170
  VPS_USER: root
  REMOTE_PATH: /var/www/moneycontrol
  NODE_BIN: /root/.nvm/versions/node/v20.19.1/bin

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install & build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote directories exist
        run: |
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p $REMOTE_PATH/backend $REMOTE_PATH/frontend/dist"

      - name: Sync backend
        run: |
          rsync -az --delete \
            backend/dist backend/package.json backend/package-lock.json backend/ecosystem.config.js \
            "$VPS_USER@$VPS_HOST:$REMOTE_PATH/backend/"

      - name: Sync frontend
        run: |
          rsync -az --delete \
            frontend/dist/ \
            "$VPS_USER@$VPS_HOST:$REMOTE_PATH/frontend/dist/"

      - name: Install prod deps and restart PM2
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            export PATH=$NODE_BIN:\$PATH
            cd $REMOTE_PATH/backend
            npm ci --omit=dev
            npm run migrate
            pm2 startOrReload ecosystem.config.js --update-env
            pm2 save
          "
